# ~/.config/mpv/mpv.conf on the Pi, installed by setup_pi.sh.
# Read by BOTH FieldStation42's mpv and the LaserTrack daemon's mpv; FS42 has
# no setting of its own for decoder options, so this file is where they go.

# Video output. FS42's install docs recommend this pair on Pi OS Trixie.
vo=gpu
gpu-api=opengl

# Hardware decoding, in order of preference (measured with `lasertrack bench`
# on the CRT, 2026-11-19):
#   v4l2m2m-copy  H.264 (76% of the library): the Pi 4's H.264 decoder
#   drm           HEVC incl. 4K 10-bit (Seinfeld): zero-copy; drm-copy was
#                 far slower (43% dropped) and software 11%
#   (software)    VC-1 and anything else falls through to the CPU
hwdec=v4l2m2m-copy,drm

# Cheap scaling. mpv's default high-quality scalers dropped 25% of frames
# taking 1080p/4K down to 480 lines; profile=fast dropped none. At composite
# resolution the difference can't be seen.
profile=fast

# Stereo for the CRT and most TVs: 5.1/7.1 Blu-ray tracks are downmixed.
audio-channels=stereo

# Read ahead: smooths 20-40 Mbps Blu-ray rips over the network.
cache=yes
demuxer-max-bytes=150MiB
demuxer-readahead-secs=20

# Kiosk: no mouse cursor, no on-screen controller, no screensaver.
cursor-autohide=always
osc=no
stop-screensaver=yes
