[project]
name = "lasertrack-cad"
version = "0.1.0"
description = "Parametric CAD (build123d) for the LaserTrack set-top box and its NFC cartridges"
requires-python = ">=3.12,<3.13"
dependencies = [
    "build123d",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pyvista>=0.49.2",
    "scipy>=1.18.1",
]
